info:
  contact: {}
  description: AI 驱动的小游戏创作社区后端(详见 docs/09-api-design.md)。
  title: Classic Games API
  version: "0.1"
paths:
  /achievements:
    get:
      parameters:
      - description: zh/en/ja,默认 zh
        in: query
        name: lang
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: 成就列表
      tags:
      - commerce
  /achievements/{id}/claim:
    post:
      parameters:
      - description: 成就 id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: balance + reward + claimed
          schema:
            additionalProperties: true
            type: object
        "400":
          description: COMMERCE_INVALID(未达成 / 已领取)
          schema:
            $ref: '#/definitions/github_com_yldm-tech_classic-games_apps_server_pkg_httpx.Envelope'
        "404":
          description: COMMERCE_INVALID(成就不存在)
          schema:
            $ref: '#/definitions/github_com_yldm-tech_classic-games_apps_server_pkg_httpx.Envelope'
      summary: 领取成就奖励
      tags:
      - commerce
  /activity:
    get:
      parameters:
      - description: zh|en|ja(默认 zh)
        in: query
        name: lang
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: 通知动态列表
      tags:
      - inbox
  /ai/balance:
    post:
      consumes:
      - application/json
      description: 按目标难度联动调整玩家与敌人/波次参数，返回 JSON Patch、合法新 DSL 和前后压力指标
      parameters:
      - description: runtime / current_dsl / target_difficulty
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_ai.BalanceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_ai.BalanceResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_yldm-tech_classic-games_apps_server_pkg_httpx.Envelope'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/github_com_yldm-tech_classic-games_apps_server_pkg_httpx.Envelope'
      summary: 自动平衡 Runtime DSL
      tags:
      - ai
  /ai/mod:
    post:
      consumes:
      - application/json
      description: 自然语言 + 当前 DSL → 6902 补丁 → apply → schema 校验 → 新 DSL
      parameters:
      - description: runtime / current_dsl / prompt
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_ai.ModRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_ai.ModResponse'
        "400":
          description: BAD_REQUEST
          schema:
            $ref: '#/definitions/github_com_yldm-tech_classic-games_apps_server_pkg_httpx.Envelope'
        "422":
          description: DSL_INVALID
          schema:
            $ref: '#/definitions/github_com_yldm-tech_classic-games_apps_server_pkg_httpx.Envelope'
        "429":
          description: QUOTA_EXCEEDED
          schema:
            $ref: '#/definitions/github_com_yldm-tech_classic-games_apps_server_pkg_httpx.Envelope'
      summary: AI 改 DSL(核心接口)
      tags:
      - ai
  /ai/structure:
    post:
      consumes:
      - application/json
      description: 按提示词、数量和难度向 Runtime map 追加不覆盖的结构节点，并经过 Schema 校验
      parameters:
      - description: runtime / current_dsl / prompt / count / difficulty
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_ai.StructureRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_ai.StructureResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_yldm-tech_classic-games_apps_server_pkg_httpx.Envelope'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/github_com_yldm-tech_classic-games_apps_server_pkg_httpx.Envelope'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/github_com_yldm-tech_classic-games_apps_server_pkg_httpx.Envelope'
      summary: 生成敌人或波次结构
      tags:
      - ai
  /ai/validate:
    post:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/github_com_yldm-tech_classic-games_apps_server_pkg_httpx.Envelope'
      summary: 校验 DSL 是否合法
      tags:
      - ai
  /analytics/events:
    post:
      consumes:
      - application/json
      parameters:
      - description: 事件
        in: body
        name: body
        required: true
        schema:
