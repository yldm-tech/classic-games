packages:
  - apps/web

# @astrojs/astro2tsx (pulled in by @astrojs/check) ships a WASM binding that pins @emnapi/core to 1.11.3 but does not declare the matching @emnapi/runtime, which its @napi-rs/wasm-runtime dependency needs as a peer. Left alone, pnpm satisfies that peer with the 2.x beta already in the tree for other packages, and the 1.x core then crashes against the 2.x runtime as soon as `astro check` starts. Declaring the dependency here keeps the pair on the same version.
packageExtensions:
  '@astrojs/astro2tsx@0.1.3':
    dependencies:
      '@emnapi/runtime': 1.11.3
