version: 2
updates:
  # The Go modules reference each other through relative replace directives, so they are updated together to keep shared dependencies on the same version.
  - package-ecosystem: gomod
    directories:
      - /apps/server
      - /apps/cli
      - /apps/mcp
      - /packages/dsl
      - /packages/sdk
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      go-minor-patch:
        update-types:
          - minor
          - patch
    # jsonschema v6.0.3 attaches a propertyNames error to an arbitrary sibling object (the location changes from run to run with map iteration order), which would put a wrong path in validation output. Lift this when a later release reports the right object.
    ignore:
      - dependency-name: github.com/santhosh-tekuri/jsonschema/v6
        versions:
          - 6.0.3

  # pnpm workspace rooted at the repository root; it covers apps/web.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
    # astro check (@astrojs/check) refuses to run on a TypeScript major it does not support yet. Lift this once it supports the new major.
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
